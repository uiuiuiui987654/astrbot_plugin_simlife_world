name: CI

on:
  push:
    branches: [main, "refactor/**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        # AstrBot itself is replaced by tests/astrbot_stub.py; the plugin's own requirements are real.
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest ruff
      - name: Lint (ruff)
        run: ruff check .
      - name: Frontend bundles up to date
        run: python tools/build_frontend.py --check
      - name: Tests
        run: python -m pytest
